name: Build

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: linux
            path: pkg
          - os: windows-latest
            name: windows
            path: target/release/cartridge.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Linux dependencies
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev
      - run: cargo build --release
      - name: Package Linux (app + menu entry + installer)
        if: matrix.os == 'ubuntu-latest'
        run: |
          mkdir pkg
          cp target/release/cartridge pkg/
          cp linux/cartridge.desktop linux/cartridge.png linux/install-linux.sh pkg/
          chmod +x pkg/cartridge pkg/install-linux.sh
      - uses: actions/upload-artifact@v4
        with:
          name: cartridge-${{ matrix.name }}
          path: ${{ matrix.path }}

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - run: |
          # artifact upload/download drops the executable bit, so put it back before zipping
          chmod +x dist/cartridge-linux/cartridge dist/cartridge-linux/install-linux.sh
          cd dist
          for d in cartridge-*; do (cd "$d" && zip -r "../$d.zip" .); done
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
